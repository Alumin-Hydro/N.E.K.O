[plugin]
id = "skill_loader"
name = "技能库"
description = "安全托管完整 Agent Skills 目录，让猫娘按需读取说明与关联文件，并仅在用户逐技能授权后运行受支持的 Python 脚本。"
short_description = "Manage complete Agent Skills directories, read linked files on demand, and run supported Python scripts only after per-skill authorization."
keywords = ["技能", "Agent Skills", "SKILL.md", "references", "templates", "assets", "scripts", "スキル", "스킬"]
version = "0.2.0"
entry = "plugin.plugins.skill_loader:SkillLoaderPlugin"

[plugin.author]
name = "N.E.K.O community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[plugin_runtime]
enabled = true
auto_start = false

[plugin.store]
enabled = true

[plugin]
id = "skill_loader"
name = "技能库"
description = "让猫娘加载并使用 SKILL.md 技能：注册技能目录或粘贴技能内容，聊天中按需调用。"
short_description = "Load SKILL.md skills for the catgirl: register skill directories or paste skill content, callable on demand in chat."
keywords = ["技能", "skill", "SKILL.md", "prompt", "スキル", "스킬", "habilidad", "навык"]
version = "0.1.0"
entry = "plugin.plugins.skill_loader:SkillLoaderPlugin"

[plugin.author]
name = "N.E.K.O community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = false

[plugin.store]
enabled = true

[skills]
max_skills = 200
max_content_bytes = 262144
max_inline_chars = 4000
